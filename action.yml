name: "Estate2Code Azure Brownfield Assessment"
description: "Convert an Azure inventory export into reviewable Terraform/OpenTofu imports and Bicep scaffolds"
inputs:
  inventory:
    description: "Azure Resource Graph, ARM or canonical inventory JSON"
    required: true
  format:
    description: "resource-graph, arm or canonical"
    required: true
  terraform-state:
    description: "Optional Terraform state JSON path"
    required: false
    default: ""
  output:
    description: "Generated output directory"
    required: false
    default: "estate2code-results"
runs:
  using: "composite"
  steps:
    - shell: bash
      run: pip install "${{ github.action_path }}"
    - shell: bash
      env:
        ESTATE2CODE_INVENTORY: ${{ inputs.inventory }}
        ESTATE2CODE_FORMAT: ${{ inputs.format }}
        ESTATE2CODE_STATE: ${{ inputs.terraform-state }}
        ESTATE2CODE_OUTPUT: ${{ inputs.output }}
      run: |
        args=("$ESTATE2CODE_INVENTORY" --format "$ESTATE2CODE_FORMAT" --output "$ESTATE2CODE_OUTPUT")
        if [[ -n "$ESTATE2CODE_STATE" ]]; then
          args+=(--terraform-state "$ESTATE2CODE_STATE")
        fi
        estate2code "${args[@]}"
